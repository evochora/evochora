services:
  evochora:
    # EVOCHORA_IMAGE takes a whole reference, so it can name a tag or an exact digest
    # (…@sha256:…). A digest is the only way to redeploy precisely what once ran: a tag such as
    # nightly is overwritten by the next build. IMAGE_TAG remains the fallback so an existing
    # .env keeps working.
    image: ${EVOCHORA_IMAGE:-ghcr.io/evochora/evochora:${IMAGE_TAG:-nightly}}
    # The image starts as root and its entrypoint hands over to the user the application runs as,
    # so no user is named here.
    # Ports are no longer published directly to the host.
    # The Caddy reverse proxy will handle all incoming traffic.
    # ports:
    #   - "80:8081"
    #   - "8082:8082"
    #   - "9092:9092"
    # The demo only shows its runs: this node simulates nothing, so a deploy or a restart never
    # starts a run. The runs are recorded by hand, with a container started for that alone and
    # one of the configurations in config; README.md beside this file says how.
    command: ["bin/evochora", "node", "show"]
    volumes:
      # Mount host directories into the container for persistent data
      - ./evochora-data/storage:/home/appuser/app/data/storage
      - ./evochora-data/database:/home/appuser/app/data/database
      - ./evochora-data/topic:/home/appuser/app/data/topic
      - ./evochora-data/queue:/home/appuser/app/data/queue
      # The configuration directory (read-only): evochora.conf, which the node runs on, and
      # beside it the configurations the demo's runs are recorded with
      - ./config:/home/appuser/app/config:ro
    environment:
      # === JVM Options & Configuration Overrides via System Properties (-D) ===
      # The node listens on every interface of its container, because Caddy reaches it from
      # another one; its port is published nowhere.
      - >
        JAVA_OPTS=
        -Xmx${JAVA_MAX_MEM:-8g}
        -Dnode.processes.http.options.network.host=0.0.0.0

    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Required for HTTP/3
    volumes:
      # Mount the Caddy configuration file (read-only)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The homepage of evochora.org, which Caddy delivers itself (read-only)
      - ./site:/srv/site:ro
      # Persist Caddy's state, including acquired SSL certificates
      - caddy_data:/data
      # The access log, kept on the server so that it outlasts the container
      - ./caddy-logs:/var/log/caddy
    environment:
      # The domain name for automatic HTTPS.
      # This will be read from the .env file on the server.
      - DOMAIN_NAME=${DOMAIN_NAME}

# Docker volume for persisting Caddy's data (e.g., SSL certs)
volumes:
  caddy_data: {}
