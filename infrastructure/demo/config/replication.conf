# The upper run of the Live Demo: the default experiment, recorded at every tick.
#
# One default ancestor in the default environment, as config/evochora.conf sets it up. The run
# pauses after the pause tick, which ends a chunk of the detailed profile, so that stopping the
# node afterwards discards nothing.
#
# The experiment name is what the homepage shows: its first line as the title of the entry, the
# rest as the description, which the homepage takes as HTML. The link names no run, so the
# visualizer opens the newest one: this run has to be the last one recorded on the demo.

# The deploy puts this file beside the repository's config/evochora.conf on the server, which is
# where the include finds it.
include required("evochora.conf")

pipeline {
  tuning = ${profiles.detailed}

  services.simulation-engine.options {
    pauseTicks = [249999]

    metadata.experiment = "See one full replication, tick by tick\nOne self-replicating program, alone in a small environment, from its first instruction to the birth of its offspring. This run records every tick, so you can see each step it takes: how it harvests energy, hoards some of it and builds its offspring cell by cell. Recorded this way, the behavior of any organism can be traced exactly, whether you wrote it yourself or it evolved.<br><a href='/visualizer/?tick=0&organism=1'>Step through it in the visualizer.</a>"
  }
}
