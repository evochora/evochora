# The lower run of the Live Demo: twelve default ancestors in four variants, recorded sparsely.
#
# The ancestors stand in a grid of four columns and three rows. Each column holds one variant, so
# that every variant starts in a stripe of its own, and neighbouring stripes differ in one flag,
# across the edge of the torus as well. Everything else is the default experiment of
# config/evochora.conf: the plugins, the seed and the thermodynamics.
#
# The experiment name is what the homepage shows: its first line as the title of the entry, the
# rest as the description. This run is recorded first, so that the homepage lists it below the
# run of replication.conf.

# The deploy puts this file beside the repository's config/evochora.conf on the server, which is
# where the include finds it.
include required("evochora.conf")

# The store of a hoarding ancestor takes what lies above max-energy less the largest cell an
# energy plugin places, as the default experiment sets it
hoard-overflow = "DATA:("${pipeline.services.simulation-engine.options.runtime.organism.max-energy}" - 10000)"

pipeline {
  tuning = ${profiles.sparse}
  tuning.samplingInterval = 50000

  services.simulation-engine.options {
    environment.shape = [4096, 2304]

    organisms = [
      # hoarding, not aggressive
      { program = "default/main.evo", values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [512, 384] } }
      { program = "default/main.evo", values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [512, 1152] } }
      { program = "default/main.evo", values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [512, 1920] } }
      # hoarding, aggressive
      { program = "default/main.evo", defines { AGGRESSIVE = true }, values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [1536, 384] } }
      { program = "default/main.evo", defines { AGGRESSIVE = true }, values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [1536, 1152] } }
      { program = "default/main.evo", defines { AGGRESSIVE = true }, values { HOARD_OVERFLOW = ${hoard-overflow} }, initialEnergy = 100000, placement { positions = [1536, 1920] } }
      # no hoarding, aggressive
      { program = "default/main.evo", defines { AGGRESSIVE = true, HOARDING = false }, initialEnergy = 100000, placement { positions = [2560, 384] } }
      { program = "default/main.evo", defines { AGGRESSIVE = true, HOARDING = false }, initialEnergy = 100000, placement { positions = [2560, 1152] } }
      { program = "default/main.evo", defines { AGGRESSIVE = true, HOARDING = false }, initialEnergy = 100000, placement { positions = [2560, 1920] } }
      # no hoarding, not aggressive
      { program = "default/main.evo", defines { HOARDING = false }, initialEnergy = 100000, placement { positions = [3584, 384] } }
      { program = "default/main.evo", defines { HOARDING = false }, initialEnergy = 100000, placement { positions = [3584, 1152] } }
      { program = "default/main.evo", defines { HOARDING = false }, initialEnergy = 100000, placement { positions = [3584, 1920] } }
    ]

    metadata.experiment = "See a population evolve over the long run\nTwelve self-replicating programs and all their descendants, competing in a larger environment. This run records only a tick now and then, which lets it cover a long time. Any stretch of it can still be recorded again, tick by tick. The twelve start in four variants, with or without hoarding and with or without aggression, and every birth can mutate the offspring. Explore its population, evolution and ecology in the analyzer."
  }
}
