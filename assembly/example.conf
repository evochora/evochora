# Runs one of the example programs in the node, with persistence and visualizer as in the
# shipped configuration, in a small quiet world: no energy sources, no decay, no mutation.
# Change example-dir to run another example; every example directory holds a main.evo.
#
#   bin/evochora --config assembly/example.conf node run
#
# The engine pauses after pauseTicks; resume from the pipeline API or the visualizer to go on.
# The include is resolved relative to this file and is required: a silently skipped include
# would run the defaults of reference.conf instead of the shipped configuration.
include required("../config/evochora.conf")

example-dir = "assembly/examples/duplicate-shell"

pipeline.services.simulation-engine.options {
  compiler.source-roots = [ { path = ${example-dir} } ]
  organisms = [
    {
      program = "main.evo"
      initialEnergy = 100000
      placement { positions = [0, 0] }
    }
  ]
  environment {
    shape = [128, 96]
    topology = "TORUS"
  }
  seed = 42
  pauseTicks = [5000]
  # A quiet world without plugins; label matching is no plugin and stays as configured.
  plugins = []
}
