# The simulation of the platform comparison (org.evochora.determinism.PlatformFingerprint).
#
# Every platform runs this scenario and records a hash of every snapshot; the comparison requires
# the same hashes from all of them. The scenario holds everything the run depends on, so that it
# does not change with the shipped configuration: a world small enough to run within the time the
# test job of the build takes anyway, energy sources that keep a population alive, all four
# mutation operators, and more than one thread. The compiler's source roots are set by the program
# that runs it, because they lie on the class path.

samplingInterval = 100
accumulatedDeltaInterval = 5
snapshotInterval = 2
chunkInterval = 1
metricsWindowSeconds = 1
seed = 42

environment {
  shape = [1024, 576]
  topology = "TORUS"
}

organisms = [
  {
    program = "main.evo"
    values { HOARD_OVERFLOW = "DATA:140000" }
    initialEnergy = 100000
    placement { positions = [128, 72] }
  }
]

runtime {
  parallelism = 2
  organism {
    max-energy = 150000
    max-entropy = 50000
    error-penalty-cost = 100
    max-skips-per-tick = 100
    genome-exclude = ["STATE", "STRUCTURE:100"]
  }
  label-matching {
    className = "org.evochora.runtime.label.HammingLabelMatchingStrategy"
    options {
      tolerance = 2
      selectionSpread = 50
      foreignReach = 250
      foreignReachDeductionPerBit = 50
      namespaceFlipRate = 0.05
      namespaceBits = 8
    }
  }
  thermodynamics {
    default {
      className = "org.evochora.runtime.thermodynamics.impl.UniversalThermodynamicPolicy"
      options { base-energy = 1, base-entropy = 1 }
    }
    overrides {
      instructions {
        "PEEK, PEKI, PEKS, POKE, POKI, POKS, PPKR, PPKI, PPKS" {
          className = "org.evochora.runtime.thermodynamics.impl.UniversalThermodynamicPolicy"
          options {
            base-energy = 0
            base-entropy = 0
            read-rules {
              own {
                _default:  { energy = 1,              entropy = 500 }
                ENERGY:    { energy-permille = -1000, entropy = 0 }
                STRUCTURE: { energy-permille = 1000,  entropy = 500 }
                STATE:     { energy = 1,              entropy = 0 }
              }
              foreign {
                _default:  { energy = 500,            entropy = 500 }
                ENERGY:    { energy-permille = -1000, entropy = 0 }
                STRUCTURE: { energy-permille = 10000, entropy-permille = 10000 }
              }
              unowned {
                _default:  { energy = 5,              entropy = 5 }
                ENERGY:    { energy-permille = -1000, entropy = 0 }
                STRUCTURE: { energy-permille = 1000,  entropy = 5 }
              }
            }
            write-rules {
              _default:  { energy = 5,              entropy = -500 }
              ENERGY:    { energy-permille = 1000,  entropy = 0 }
              STRUCTURE: { energy-permille = 1000,  entropy = -500 }
              CODE:      { energy = 5,              entropy = -500, values: { "0": { energy = 0, entropy = 0 } } }
              STATE:     { energy = 5,              entropy = 0 }
            }
          }
        }
      }
      families {}
    }
  }
}

instructionWeights {
  default = 1
  families = [
    { class = "org.evochora.runtime.isa.instructions.ConditionalSkipInstruction", weight = 0.5, default = 1 }
    { class = "org.evochora.runtime.isa.instructions.ConditionalJumpInstruction", weight = 0.5, default = 1 }
  ]
}

insertionArgs {
  REGISTER { range = [0, 7] }
  LOCATION_REGISTER { range = [0, 3] }
  DATA { min = 0, max = 255 }
  LABELREF = "existing"
  VECTOR = "unit"
}

plugins = [
  {
    className = "org.evochora.runtime.worldgen.SeedEnergyCreator"
    options { fraction = 0.002, energy-amount = 5000, energy-amount-variance = 0.2 }
  },
  {
    className = "org.evochora.runtime.worldgen.GeyserCreator"
    options { fraction = 1e-5, interval = 2000, energy-amount = 5000, safety-radius = 0 }
  },
  {
    className = "org.evochora.runtime.worldgen.SolarRadiationCreator"
    options { fraction = 1e-6, energy-amount = 5000, safety-radius = 0 }
  },
  {
    className = "org.evochora.runtime.worldgen.EnergyVaultCreator"
    options {
      fraction = 1e-5, core-radius = 0, wall-thickness = 1, energy-amount = 10000
      structure-value = 1, structure-owner = -1, interval = 200, safety-radius = 0
    }
  },
  {
    className = "org.evochora.runtime.worldgen.DecayOnDeath"
    options { replacement = "CODE:0" }
  },
  {
    className = "org.evochora.runtime.worldgen.GeneDuplicationPlugin"
    options { duplicationRate = 0.2, minNopSize = 8 }
  },
  {
    className = "org.evochora.runtime.worldgen.GeneDeletionPlugin"
    options { deletionRate = 0.2, countExponent = 2.0, minLabelCount = 2 }
  },
  {
    className = "org.evochora.runtime.worldgen.GeneInsertionPlugin"
    options {
      mutationRate = 0.15
      entries = [
        { instructionWeights = ${instructionWeights}, weight = 3, args = ${insertionArgs} }
        { type = "label", weight = 1, instructionWeights = ${instructionWeights}, args = ${insertionArgs} }
      ]
    }
  },
  {
    className = "org.evochora.runtime.worldgen.GeneSubstitutionPlugin"
    options {
      substitutionRate = 0.2
      instructionWeights = ${instructionWeights}
      CODE { weight = 1.0, operationFlipWeight = 0.7, familyFlipWeight = 0.2, variantFlipWeight = 0.1 }
      REGISTER { weight = 0.2 }
      DATA { weight = 2.0, exponent = 0.9 }
      ENERGY { weight = 0.0, exponent = 0.9 }
      STRUCTURE { weight = 0.0, exponent = 0.9 }
      STATE { weight = 0.0, exponent = 0.9 }
      LABEL { weight = 1.0, bitflips = 1 }
      LABELREF { weight = 1.0, bitflips = 1 }
      operands { scalar = 2.0, vector = 1.0 }
    }
  }
]
