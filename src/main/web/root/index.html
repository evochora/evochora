<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evochora</title>
<link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicons/android-chrome-512x512.png">
<link rel="manifest" href="/favicons/site.webmanifest">
<link rel="stylesheet" href="/shared/vendor/fonts/doto/900.css">
<link rel="stylesheet" href="/shared/vendor/fonts/roboto-mono/400.css">
<link rel="stylesheet" href="/shared/vendor/fonts/roboto-mono/500.css">
<link rel="stylesheet" href="/shared/vendor/fonts/source-serif-4/opsz.css">
<link rel="stylesheet" href="/shared/vendor/fonts/ibm-plex-sans/400.css">
<link rel="stylesheet" href="/shared/vendor/fonts/ibm-plex-sans/500.css">
<link rel="stylesheet" href="/shared/vendor/fonts/ibm-plex-sans/600.css">
<link rel="stylesheet" href="/shared/app-switcher/app-switcher.css">
<style>
:root {
    --field: #0a0a14; --panel: #191923; --line: #333; --hair: #26262f; --well: #0f0f18;
    --ink: #e0e0e0; --ink-2: #aaa; --ink-3: #888;
    --blue: #4a9eff; --blue-2: #6bb3ff; --green: #a0e0a0; --orange: #ffb366; --red: #e87070;
    --tile-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --tile-serif: 'Source Serif 4 Variable', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--field); color: var(--ink);
    font: 400 13px/1.5 'Roboto Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
code { font: inherit; color: var(--ink); background: var(--well); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }

/* Header, as in the analyzer: app switcher and logo */
header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 15px; }
.brand { display: flex; align-items: center; min-width: 0; }
.logo { position: relative; font: 900 36px/1 'Doto', sans-serif; letter-spacing: 1px; opacity: .9; white-space: nowrap; }
.node { display: grid; grid-template-columns: auto auto; align-items: center; gap: 0 8px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; text-align: right; }
.node small { grid-column: 2; font-size: 11px; color: var(--ink-3); }
.node i { width: 8px; height: 8px; border-radius: 50%; background: #666; }
.node.running i, .node.starting i { background: var(--green); }
.node.paused i { background: var(--orange); }
.node.degraded i, .node.unreachable i { background: var(--red); }

main { flex: 1; min-height: 0; overflow: auto; width: 100%; max-width: 1440px; margin: 0 auto;
    padding: clamp(14px, 2.8vh, 26px) 28px 14px; display: flex; flex-direction: column; gap: clamp(16px, 3vh, 30px); }
section { display: flex; flex-direction: column; min-height: 0; }

/* The simulation runs */
.runs { flex: 0 1 auto; min-height: 170px; }
.panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    scrollbar-width: thin; scrollbar-color: #444 transparent; }
/* The gap between two columns grows with the window, so that the columns stand apart where there is
   room and the table still fits where there is little */
table { width: 100%; border-collapse: collapse; --gap: clamp(10px, 7.4vw - 71px, 36px); }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); box-shadow: inset 0 -1px 0 var(--line);
    font-weight: 400; font-size: 12px; color: var(--ink-3); text-align: left; white-space: nowrap; padding: 11px var(--gap) 8px 0; }
td { height: 44px; padding: 0 var(--gap) 0 0; white-space: nowrap; border-bottom: 1px solid var(--hair); }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 20px; }
th:last-child, td:last-child { padding-right: 20px; text-align: right; }
th.num, td.num { text-align: right; }
tbody tr:hover td { background: rgba(60, 80, 120, .16); }
.name { font-weight: 500; }
.copy { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 18px; margin-left: 6px; padding: 0; vertical-align: -4px; background: none; border: 1px solid transparent; border-radius: 3px;
    color: var(--ink-3); cursor: pointer; }
.copy:hover { border-color: var(--line); color: var(--ink); }
.copy.done { color: var(--green); }
.copy svg { display: block; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.topology { margin-left: 10px; font-size: 11px; color: var(--ink-3); }
.per { display: block; margin-top: 3px; font-size: 12px; line-height: 1; color: var(--ink-3); }

/* The run the node is simulating */
tr.live td { background: transparent; }
tr.live:hover td { background: rgba(60, 80, 120, .16); }
tr.live td:first-child { box-shadow: inset 2px 0 0 var(--green); }

tr.live.paused td:first-child { box-shadow: inset 2px 0 0 var(--orange); }

tr.live.degraded td:first-child { box-shadow: inset 2px 0 0 var(--red); }
.tick { display: inline-block; background: var(--well); border: 1px solid var(--line); border-radius: 4px; padding: 1px 10px;
    font-size: 17px; font-weight: 500; line-height: 24px; color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; margin-left: 12px; vertical-align: 1px;
    border: 1px solid rgba(160, 224, 160, .45); border-radius: 3px; background: rgba(160, 224, 160, .08);
    color: var(--green); font-size: 11px; line-height: 1; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.paused { color: var(--orange); border-color: rgba(255, 179, 102, .45); background: rgba(255, 179, 102, .08); }
.chip.degraded { color: var(--red); border-color: rgba(232, 112, 112, .5); background: rgba(232, 112, 112, .08); }
@media (prefers-reduced-motion: no-preference) { .chip.running i, .chip.starting i { animation: beat 2s ease-in-out infinite; } }
@keyframes beat { 50% { opacity: .3; } }

.btn { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; margin-left: 6px; cursor: pointer; white-space: nowrap;
    background: var(--well); border: 1px solid var(--line); border-radius: 3px; color: var(--ink-2); font: inherit; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:hover { background: #1a1a2a; border-color: #555; color: var(--ink); }
.btn.door { background: #1a2a3a; border-color: var(--blue); color: var(--blue); }
.btn.door:hover { background: #20364c; color: var(--blue-2); }
.rule { display: inline-block; width: 1px; height: 16px; margin: 0 6px 0 12px; background: var(--line); vertical-align: middle; }
.panel .none { margin: 0; padding: 18px 20px 20px; color: var(--ink-2); line-height: 2; }
.panel .none a { color: var(--blue); } .panel .none a:hover { text-decoration: underline; }
.panel .none.error { color: var(--red); }

/* The documentation: the tiles for the work on an experiment, the remaining topics in the footer */
.docs { flex: none; position: relative; margin-top: auto; }
.copy { position: relative; }
.copied { position: absolute; z-index: 2; left: calc(100% + 4px); top: 50%; transform: translateY(-50%); padding: 1px 6px; background: var(--well); border: 1px solid var(--line); border-radius: 3px; font-size: 11px; line-height: 14px; color: var(--green); pointer-events: none; }
.more .version { height: calc(.8rem * 1.55); line-height: calc(.8rem * 1.55); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.more .plain { width: 152px; }
/* Every column is as wide as its content. The width left over goes to one column: the name of the
   runs and, where no run has a name, their start. */
th, td { width: 1%; }
th.fill, td.fill { width: auto; }
td.name { max-width: 0; overflow: hidden; text-overflow: ellipsis; }
.work { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.topic { display: flex; flex-direction: column; padding: .8rem 1rem .85rem 19px; border-left: 2px solid var(--blue); background: rgba(74, 158, 255, .03); border-radius: 0 4px 4px 0; }
.topic.start { border-left-width: 3px; padding-left: 18px; background: rgba(74, 158, 255, .09); }
.topic h3, .more h3 { margin: 0 0 .3rem; font-family: var(--tile-sans); font-size: .875rem; font-weight: 600; color: #d8d8de; }
.topic.start h3 { font-size: 1rem; color: #fff; }
.topic p { margin: 0; font-family: var(--tile-serif); font-size: .9rem; line-height: 1.5; color: rgba(216, 216, 222, .7); }
.topic.start p { color: rgba(216, 216, 222, .88); }
.links { margin: auto 0 0; padding: .65rem 0 0; list-style: none; display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, auto); justify-content: start; gap: .2rem 1.5rem; }
.links a, .more a { color: var(--blue); font-family: var(--tile-sans); font-size: .8rem; font-weight: 500; white-space: nowrap; }
.links a:hover, .more a:hover { text-decoration: underline; }
.more { display: grid; grid-template-columns: repeat(7, auto); justify-content: space-between; gap: 16px; padding: 14px 0 0 21px; border-top: 1px solid var(--hair); }
.more h3 { font-size: .8rem; color: rgba(216, 216, 222, .75); white-space: nowrap; }
.more .plain h3 { font-family: inherit; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.more a { display: block; width: fit-content; line-height: 1.55; }

footer { flex: none; }

@media (max-height: 720px) {
    main { padding: 12px 28px 8px; gap: 13px; }
    .runs { min-height: 150px; }
    td { height: 40px; }
    .docs { gap: 12px; } .work { gap: 12px; } .topic { padding: .55rem .9rem .6rem 19px; } .topic p { font-size: .84rem; line-height: 1.38; } .links { margin-top: .4rem; }
}
@media (max-width: 1320px) { .chip { margin-left: 8px; } .rule { margin: 0 2px 0 8px; } .btn { padding: 0 8px; } }
/* While the first answer of the node is awaited: the analyzer's line under the logo, and no list yet */
.logo.loading::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; height: 2px; width: 30%;
    background: var(--blue); animation: loading-pulse 1.5s ease-in-out infinite; }
@keyframes loading-pulse { 0% { width: 30%; } 50% { width: 100%; } 100% { width: 30%; } }
</style>
</head>
<body>
<header>
    <div class="brand">
        <div id="app-switcher-container"></div>
        <div class="logo loading" id="logo">EVOCHORA</div>
    </div>
    <div class="node" id="node"><i hidden></i><span></span><small id="pace"></small></div>
</header>

<main>
    <section class="runs">
        <div class="panel" id="runs"></div>
    </section>

    <section class="docs"><div class="work" id="work"></div></section>

    <footer><div class="more" id="more"></div></footer>
</main>

<script type="module">
import { AppSwitcher } from '/shared/app-switcher/AppSwitcher.js';

const pageParams = new URLSearchParams(window.location.search);

try {
    const apps = await (await fetch('/shared/app-switcher/apps.json')).json();
    new AppSwitcher({
        element: document.getElementById('app-switcher-container'),
        apps,
        getState: () => ({ tick: pageParams.get('tick'), organism: pageParams.get('organism'), runId: pageParams.get('runId') })
    });
} catch (e) {
    console.error('Failed to initialize AppSwitcher:', e);
}

// ── Helpers ──
const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const groupDigits = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const json = url => fetch(url).then(response => response.ok ? response.json() : null).catch(() => null);
const copyIcon = (value, what) => '<button class="copy" type="button" data-copy="' + escapeHtml(value) + '" title="Copy the ' + what + ' ' + escapeHtml(value)
    + '" aria-label="Copy the ' + what + '"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/>'
    + '<path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg></button>';

document.addEventListener('click', event => {
    const button = event.target.closest('.copy');
    if (!button || !navigator.clipboard) return;
    navigator.clipboard.writeText(button.dataset.copy).then(() => {
        const note = document.createElement('span');
        note.className = 'copied';
        note.textContent = 'Copied';
        button.classList.add('done');
        button.appendChild(note);
        setTimeout(() => { button.classList.remove('done'); note.remove(); }, 1400);
    }, () => {});
});

// ── Documentation ──
// A release links the documents as its tag holds them; a build made for no release links main.
const REPOSITORY = 'https://github.com/evochora/evochora';
const PLUGIN_SOURCES = 'src/main/java/org/evochora/';
const file = path => ref => REPOSITORY + '/blob/' + ref + '/' + path;
const directory = path => ref => REPOSITORY + '/tree/' + ref + '/' + path;
const fixed = url => () => url;
const userGuide = anchor => file('docs/USER_GUIDE.md' + (anchor ? '#' + anchor : ''));

const WORK = [
    { label: 'Run Experiments', emphasis: true,
        text: 'Follow the User Guide through a full experiment, from the first start to sharing its results, and look up every command in the CLI Usage Guide.',
        links: [['User Guide', userGuide()], ['CLI Usage Guide', file('docs/CLI_USAGE.md')]] },
    { label: 'Configure an Experiment',
        text: 'Learn in the User Guide how to set up an experiment, start from the template with the most important settings, and look up every setting in the full reference.',
        links: [['User Guide', userGuide('3-configure-an-experiment')], ['evochora.conf', file('config/evochora.conf')],
            ['reference.conf', file('src/main/resources/reference.conf')]] },
    { label: 'Write Organisms',
        text: 'Start from an ancestor that comes with Evochora, reuse behaviors from the library, and learn the EvoASM language.',
        links: [['User Guide', userGuide('2-choose-or-write-an-ancestor')], ['Ancestors', file('assembly/ancestors/README.md')],
            ['Behavior Library', file('assembly/lib/behavior/README.md')], ['Assembly Specification', file('docs/EVOASM_SPEC.md')],
            ['EvoASM Guidelines', file('docs/EVOASM_GUIDELINES.md')], ['Syntax Highlighting', file('extensions/vscode/README.md')]] },
    { label: 'Analyze the Data',
        text: 'Write analyses of a run\'s data in Python. The User Guide and the notebook show how, and plugins let you add further metrics.',
        links: [['User Guide', userGuide('7-analyze-the-data')], ['Analysis Notebook', file('notebooks/README.md')],
            ['Analytics Plugins', directory(PLUGIN_SOURCES + 'datapipeline/services/analytics/plugins')]] }
];
const MORE = [
    { label: 'Build Plugins', links: [['User Guide', userGuide('10-extend-evochora-with-plugins')], ['Reference Plugins', directory(PLUGIN_SOURCES + 'runtime/worldgen')]] },
    { label: 'API Documentation', links: [['HTTP API Reference', fixed('/api-docs/')]] },
    { label: 'Understand the Project', links: [['Scientific Overview', file('docs/SCIENTIFIC_OVERVIEW.md')],
        ['Published Experiments', file('docs/PUBLISHED_EXPERIMENTS.md')], ['Origin Story', file('docs/ORIGIN_STORY.md')]] },
    { label: 'Work on the Code', links: [['Development Guide', file('docs/dev/DEVELOPMENT.md')], ['Architecture', file('docs/dev/ARCHITECTURE.md')],
        ['Architecture & Design Decisions', file('docs/dev/ARCHITECTURE_DECISIONS.md')]] },
    { label: 'Contribute', links: [['Contributing Guide', file('CONTRIBUTING.md')], ['AI Policy', file('AI_POLICY.md')], ['Code of Conduct', file('CODE_OF_CONDUCT.md')]] },
    { label: 'Get Help', links: [['Discord', fixed('https://discord.gg/t9yEJc4MKX')], ['Discussions', fixed(REPOSITORY + '/discussions')],
        ['Issues', fixed(REPOSITORY + '/issues')]] }
];
const PROJECT = [['MIT License', file('LICENSE')], ['GitHub', fixed(REPOSITORY)]];

let ref = 'main';
const anchor = ([label, target]) => {
    const url = target(ref);
    return '<a href="' + url + '"' + (url.startsWith('/') ? '' : ' target="_blank" rel="noopener noreferrer"') + '>' + escapeHtml(label) + '</a>';
};

function renderDocumentation(build) {
    document.getElementById('work').innerHTML = WORK.map(topic =>
        '<div class="topic' + (topic.emphasis ? ' start' : '') + '"><h3>' + topic.label + '</h3><p>' + topic.text + '</p><ul class="links">'
        + topic.links.map(link => '<li>' + anchor(link) + '</li>').join('') + '</ul></div>').join('');
    document.getElementById('more').innerHTML = MORE.map(topic => '<div><h3>' + topic.label + '</h3>' + topic.links.map(anchor).join('') + '</div>').join('')
        + '<div class="plain"><h3>&nbsp;</h3>' + PROJECT.map(anchor).join('') + build + '</div>';
}

// The node names its build in the API specification: the release tag, or "revision <hash>" for a build made for no release.
const REVISION_PREFIX = 'revision ';
const SHORT_REVISION_LENGTH = 7;
async function describeBuild() {
    const specification = await json('/api-docs/openapi.json');
    const version = specification && specification.info ? specification.info.version : null;
    if (!version) return '';
    if (!version.startsWith(REVISION_PREFIX)) {
        ref = version;
        return '<div class="version">Evochora ' + escapeHtml(version) + '</div>';
    }
    const revision = version.slice(REVISION_PREFIX.length);
    return '<div class="version" title="' + escapeHtml(version) + '">' + REVISION_PREFIX + escapeHtml(revision.slice(0, SHORT_REVISION_LENGTH))
        + copyIcon(revision, 'revision') + '</div>';
}
renderDocumentation('');
describeBuild().then(renderDocumentation);

// ── Runs and the state of the node ──
const REFRESH_INTERVAL_MS = 1000;
const RUN_LIST_INTERVAL_MS = 15000;
const TOGGLE_TIMEOUT_MS = 8000;
const UNNAMED = 'unnamed';
const DASH = '—';
const NODE_LABEL = { running: 'Simulation running', starting: 'Simulation starting', paused: 'Simulation paused', degraded: 'Pipeline degraded',
    none: 'No simulation running', unreachable: 'Node not reachable' };
const CHIP_HINT = { degraded: 'A service of the pipeline is not healthy', starting: 'The run is simulating, its first data is not recorded yet' };

const nodeElement = document.getElementById('node');
const paceElement = document.getElementById('pace');
const panel = document.getElementById('runs');
const facts = {};        // runId -> what never changes: name, environment, sampling
const recorded = {};     // runId -> what was last read: minTick, maxTick, alive, born
let runIds = [];
let runListReadAt = 0;
let pendingToggle = null;   // { leaving: the engine state the click wants to leave, since }
let lastMarkup = null;

const query = runId => '?runId=' + encodeURIComponent(runId);
const started = runId => {
    const m = runId.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
    return m ? m[1] + '-' + m[2] + '-' + m[3] + ' ' + m[4] + ':' + m[5] : runId;
};

async function readFacts(runId) {
    if (facts[runId]) return;
    const metadata = await json('/visualizer/api/simulation/metadata' + query(runId));
    if (!metadata) return;
    let name = '';
    try { name = (JSON.parse(metadata.resolvedConfigJson).metadata || {}).experiment || ''; } catch (e) { /* a run without a readable name has none */ }
    facts[runId] = { name: name === UNNAMED ? '' : name, size: metadata.environment.shape.join(' × '),
        topology: metadata.environment.topology, sampling: metadata.samplingInterval };
}

async function readRecorded(runId) {
    const ticks = await json('/visualizer/api/organisms/ticks' + query(runId));
    if (!ticks || ticks.maxTick === null || ticks.maxTick === undefined) return;
    const known = recorded[runId];
    if (known && known.maxTick === ticks.maxTick) return;
    const organisms = await json('/visualizer/api/organisms/' + ticks.maxTick + query(runId));
    recorded[runId] = { minTick: ticks.minTick, maxTick: ticks.maxTick, alive: organisms ? organisms.organisms.length : null, born: organisms ? organisms.totalOrganismCount : null };
}

function stateOf(status, engine, activeRunId) {
    if (engine.state === 'PAUSED') return 'paused';
    if (status.status === 'DEGRADED') return 'degraded';
    if (status.status !== 'RUNNING') return 'none';
    return activeRunId && !recorded[activeRunId] ? 'starting' : 'running';
}

function toolLinks(runId) {
    const params = new URLSearchParams({ runId });
    ['tick', 'organism'].forEach(key => { if (pageParams.get(key)) params.set(key, pageParams.get(key)); });
    return '<a class="btn" href="/visualizer/?' + params + '">Visualizer</a><a class="btn" href="/analyzer/?' + params + '">Analyzer</a>';
}

// A run that starts at tick 0 is named by its last tick. A fork holds a stretch of its parent run and
// is named by that stretch.
function ticksOf(r) {
    if (!r) return DASH;
    return r.minTick > 0 ? groupDigits(r.minTick) + '\u00a0\u2013\u00a0' + groupDigits(r.maxTick) : groupDigits(r.maxTick);
}

function row(runId, activeRunId, state, named) {
    const active = runId === activeRunId;
    const f = facts[runId], r = recorded[runId];
    const number = value => value === null || value === undefined ? DASH : groupDigits(value);
    const chip = active ? '<span class="chip ' + state + '" title="' + (CHIP_HINT[state] || '') + '"><i></i>' + state + '</span>' : '';
    const toggle = active ? '<button class="btn" type="button" data-toggle="' + (state === 'paused' ? 'resume' : 'pause') + '"' + (pendingToggle ? ' disabled' : '') + '>'
        + (state === 'paused' ? 'Continue' : 'Pause') + '</button><i class="rule"></i>' : '';
    return '<tr class="' + (active ? 'live ' + state : '') + '"><td' + (named ? '' : ' class="fill"') + '>' + started(runId) + copyIcon(runId, 'run ID') + chip + '</td>'
        + (named ? '<td class="name fill" title="' + escapeHtml(f ? f.name : '') + '">' + escapeHtml(f ? f.name : '') + '</td>' : '')
        + '<td>' + (f ? f.size + '<span class="topology">' + escapeHtml(f.topology) + '</span>' : DASH) + '</td>'
        + '<td class="num">' + number(f ? f.sampling : null) + '</td><td class="num">' + ticksOf(r) + '</td>'
        + '<td class="num">' + number(r ? r.alive : null) + '</td><td class="num">' + number(r ? r.born : null) + '</td>'
        + '<td>' + toggle + toolLinks(runId) + '</td></tr>';
}

function renderRuns(markup) {
    if (markup === lastMarkup) return;   // an unchanged list keeps its scroll position and an open tooltip
    lastMarkup = markup;
    panel.innerHTML = markup;
}

async function refresh() {
    const status = await json('/pipeline/api/status');
    nodeElement.firstElementChild.hidden = false;
    if (!status) {
        nodeElement.className = 'node unreachable';
        nodeElement.children[1].textContent = NODE_LABEL.unreachable;
        paceElement.textContent = '';
        renderRuns('<p class="none error">This node is not reachable.</p>');
        return;
    }
    const engine = (status.services || []).find(service => service.name === 'simulation-engine') || {};
    const simulating = engine.state === 'PAUSED' || status.status === 'RUNNING' || status.status === 'DEGRADED';
    const activeRunId = simulating ? status.activeRunId || null : null;

    if (Date.now() - runListReadAt > RUN_LIST_INTERVAL_MS || (activeRunId && !runIds.includes(activeRunId))) {
        const listed = await json('/analyzer/api/runs');
        if (listed) {
            runIds = listed.sort((a, b) => b.startTime - a.startTime).map(run => run.runId);
            // A run that simulates but is not indexed yet is listed all the same
            if (activeRunId && !runIds.includes(activeRunId)) runIds.unshift(activeRunId);
            runListReadAt = Date.now();
        }
    }
    await Promise.all(runIds.map(runId => Promise.all([readFacts(runId), runId === activeRunId || !recorded[runId] ? readRecorded(runId) : null])));

    const state = stateOf(status, engine, activeRunId);
    if (pendingToggle && (engine.state !== pendingToggle.leaving || Date.now() - pendingToggle.since > TOGGLE_TIMEOUT_MS)) pendingToggle = null;
    nodeElement.className = 'node ' + state;
    nodeElement.children[1].textContent = NODE_LABEL[state];
    // The engine reports a stale speed for some seconds after it was paused
    const speed = (engine.metrics || {}).ticks_per_second;
    paceElement.textContent = (state === 'running' || state === 'degraded') && speed !== undefined ? groupDigits(Math.round(speed)) + ' ticks per second' : '';

    if (!runIds.length) {
        renderRuns('<p class="none">No simulation runs on this node yet.<br>Start one with <code>bin/evochora node run</code>, as '
            + anchor(['Start and Manage Runs', userGuide('4-start-and-manage-runs')]) + ' in the User Guide describes.</p>');
        return;
    }
    const named = runIds.some(runId => facts[runId] && facts[runId].name);
    renderRuns('<table><thead><tr><th' + (named ? '' : ' class="fill"') + '>Started</th>' + (named ? '<th class="fill">Name</th>' : '') + '<th>Environment</th>'
        + '<th class="num" title="A run records every n-th tick">Sampling</th><th class="num">Ticks</th>'
        + '<th class="num">Alive</th><th class="num">Born</th><th></th></tr></thead><tbody>'
        + runIds.map(runId => row(runId, activeRunId, state, named)).join('') + '</tbody></table>');
}

// The node accepts every pause and resume request, so the outcome is read from its state afterwards
document.addEventListener('click', event => {
    const button = event.target.closest('[data-toggle]');
    if (!button || button.disabled) return;
    pendingToggle = { leaving: button.dataset.toggle === 'pause' ? 'RUNNING' : 'PAUSED', since: Date.now() };
    button.disabled = true;
    fetch('/pipeline/api/' + button.dataset.toggle, { method: 'POST' }).catch(() => {});
});

let refreshing = false;
async function tick() {
    if (refreshing) return;
    refreshing = true;
    try { await refresh(); } finally { refreshing = false; document.getElementById('logo').classList.remove('loading'); }
}
tick();
setInterval(tick, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
