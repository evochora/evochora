# Actions are pinned to a commit, with the release tag beside it, for the reason given in
# build.yml — with one deliberate exception, claude-code-action below.

name: Claude Architecture Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  architecture-review:
    # A pull request opened from a fork runs without the repository's secrets, so the review
    # step could not authenticate and the job would fail every time. Skipping it there keeps a
    # contributor's pull request free of a check that cannot pass.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for proper diff

      - name: Run Claude Architecture Review
        id: claude-review
        # Left on the moving tag on purpose. v1 is a rolling pointer rather than a fixed
        # release, so pinning it would freeze this action until someone noticed a newer one
        # existed and looked up its commit — and improvements to the reviewer are wanted as
        # they appear. The trade is acceptable here and not elsewhere: this is the vendor's
        # own action, the same vendor whose tooling already runs against this repository with
        # far broader access, and the job may only read contents and write comments.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            You are the architecture reviewer for the Evochora project. You review design,
            structure and the project's architectural rules. Correctness (bugs, wrong results,
            edge cases) is reviewed by a separate job that compiles and runs probe tests; leave
            it out.

            IMPORTANT: ALWAYS post a PR comment, even when there are no findings. Never be
            silent.

            Do the review yourself, in this conversation. Do NOT delegate to subagents
            (the Agent tool, including the project's own agents under .claude/agents/):
            this job ends when your turn ends, and a review left with a background agent
            is never posted. Read the guidelines and the diff directly, then write the
            comment before you finish.

            ## Your Review Process

            1. First, read the project guidelines:
               - Read AGENTS.md for general agent guidelines
               - Read .agents/architecture-guidelines.md for the detailed architectural review checklist

            2. Then analyze the PR changes at: ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            3. Apply both sets of guidelines to review the code changes, including the design
            judgement section of the architecture guidelines.

            ## Required Output Format

            The comment is read by an agent that works through every finding with the
            maintainer, one at a time. It contains findings only: no summary of what the PR
            does, no list of what is fine.

            Title the comment "Architecture Review" and group the findings as in Step 4 of
            the architecture guidelines (Violations, Concerns, Recommendations), most severe
            first. Documentation and test coverage findings go into the same groups. For each
            finding:
            - **Where**: file and line
            - **What**: the problem, in one or two sentences
            - **Why**: the rule it breaks, or for a design finding the alternative and the case
              in which the chosen design does worse
            - **Change**: what to do instead

            When there are no findings, the comment says so in one line.

