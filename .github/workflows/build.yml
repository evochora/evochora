# Actions are pinned to a commit, with the release tag beside it. A tag such as @v4 is a moving
# pointer: whoever owns the action can aim it at different code, and the next run would fetch that.
# A commit cannot move. Updating one means resolving the new tag to its commit and replacing both.

name: Build and Release

on:
  # Started by hand with a version, a run prepares the release of that version from its draft
  # and publishes it once the maintainer has approved. Without a version, a run on main builds
  # and publishes the nightly whether or not main has changed, and one on another branch builds
  # and publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, as the tag of its draft names it (e.g. "v1.0.0"). Empty for a nightly.'
        required: false
        type: string
  # The nightly. GitHub starts scheduled runs late or not at all at the full hour, when most
  # schedules fire, so the minute is an odd one.
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Each pull request has one group, and so has main. A newer run cancels the older run of its
# group, so only the newest state of a pull request or of main is checked. The runs that build
# the nightly, the scheduled one and one started by hand, have a group of their own beside the
# runs a push starts: a push to main must not cancel the nightly, which builds an earlier commit
# to its end. A nightly cancelled by a newer one while it publishes can leave no nightly at all
# until that newer run has passed, which creates it anew. The runs of a release have a group for
# each version: such a run waits for the maintainer's approval, for days if need be, and neither
# a push nor a nightly may cancel it; only a newer run for the same version does.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
    inputs.version && format('release-{0}', inputs.version) ||
    (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'push' }}
  cancel-in-progress: true

jobs:
  # Decides what this run does, for every job after it. A push to main is tested and nothing
  # more: what main holds is published at night. A pull request, or a run started by hand on
  # another branch, also builds the distributions, starts them and builds the image, and
  # publishes nothing. The scheduled run builds and publishes the nightly when main has changed
  # since the nightly that is published, and does nothing at all otherwise, so that the date of
  # the nightly names the last change of main; a run started by hand on main builds and publishes
  # it without that question. A run started by hand with a version builds that release.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      package: ${{ steps.plan.outputs.package }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Decide what this run builds and publishes
        id: plan
        env:
          # Read from the environment rather than written into the script: the version is
          # typed by whoever starts the run, and a shell would read what it holds as syntax.
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build=true; package=true; publish=false; release=false; tag=
          if [ -n "$VERSION" ]; then
            # The form the build takes for a version, with a suffix or without: v1.0.0, v1.0.0-rc.1
            if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Not a version: '$VERSION'. Expected v and numbers separated by dots," \
                   "with or without a suffix after a hyphen, such as v1.0.0 or v1.0.0-rc.1."
              exit 1
            fi
            tag=$VERSION; release=true
          elif [ "$EVENT_NAME" = "push" ]; then
            package=false
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # The tag nightly stands on the commit the published nightly was built from. There is
            # none before the first nightly.
            published=$(gh api "repos/$REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2> /dev/null || true)
            if [ "$published" = "$GITHUB_SHA" ]; then
              echo "The published nightly was built from $GITHUB_SHA, the head of main: nothing to build."
              build=false; package=false
            else
              tag=nightly; publish=true
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=nightly; publish=true
          fi
          {
            echo "build=$build"
            echo "package=$package"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  # A release is built from a draft the maintainer wrote, and everything that can be checked
  # about it is checked here, before anything is built: that there is exactly one draft for the
  # version and no release or tag of that name yet, and that the draft has a text. A draft is
  # visible only to a token that may write, which is why this is a job of its own.
  draft:
    name: Check the Draft
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the draft of the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$REPOSITORY/releases" | jq -s --arg tag "$VERSION" '[.[][] | select(.tag_name == $tag)]')
          if [ "$(jq '[.[] | select(.draft | not)] | length' <<< "$releases")" -ne 0 ]; then
            echo "::error::$VERSION is published already."; exit 1
          fi
          if [ "$(jq length <<< "$releases")" -ne 1 ]; then
            echo "::error::Expected one draft release with the tag $VERSION, found $(jq length <<< "$releases")." \
                 "Write the draft in GitHub first: tag $VERSION, target main, the release notes."
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$VERSION" --silent 2> /dev/null; then
            echo "::error::The tag $VERSION exists already. Publishing the draft creates it."; exit 1
          fi
          # What the workflow itself wrote below its line in an earlier run is no text of the draft
          if [ -z "$(jq -r '.[0].body // ""' <<< "$releases" | sed '/^<!-- What follows is written by the release workflow/,$d' | tr -d '[:space:]')" ]; then
            echo "::error::The draft of $VERSION has no text. Write the release notes first."; exit 1
          fi

  notebooks:
    name: Verify Notebooks
    runs-on: ubuntu-latest
    # Notebooks are committed without outputs, enforced by a git clean filter that each clone
    # has to register once. Git silently ignores an unregistered filter, so this job is what
    # actually keeps generated data out of the repository.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify notebooks contain no execution state
        run: python3 tools/nbstrip.py --check notebooks

  test:
    name: Build & Test
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Runs for a release as well: the release is built from the commit this run fixes, so its
    # tests run on that commit rather than relying on an earlier run that nothing ties to it
    strategy:
      # Every leg runs to its end, so that a failure on one platform does not hide whether the
      # others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      checks: write
      # Writing the new-code coverage comment on a pull request.
      pull-requests: write
    steps:
      - name: Fix Git Path on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The new-code coverage step needs the merge base, which a shallow clone does not
          # contain. The full history costs bandwidth, so only the run that computes it takes it.
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      # npm keeps the packages of the web frontend in the project's .gradle/npm-cache, which the
      # Gradle cache above does not cover. Keyed on the lock file, npm ci downloads them again only
      # when the lock file changes.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # PMD keys its incremental cache on file content, ruleset and classpath, so a cache from an
      # earlier commit is valid for every unchanged file. Without it every run analyses the whole
      # tree, and the test sources alone take PMD longer than compiling the project.
      - name: Restore PMD incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tmp/pmd*/incremental.cache
          key: pmd-${{ runner.os }}-${{ github.sha }}
          restore-keys: pmd-${{ runner.os }}-
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      # check, not build: the archives that assemble would add are built and started by the
      # package and start-test jobs
      - name: Build and run tests with Gradle
        run: ./gradlew check --info --stacktrace
      # Coverage of the lines this branch changes, as a counterpart to the project-wide gate the
      # build applies. It reads the JaCoCo report the previous step produced and therefore has to
      # follow it. One pull request gets one comment, so only the Linux leg of the matrix runs it.
      - name: Measure new-code coverage
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./gradlew newCodeCoverage "-PnewCodeCoverage.baseRef=origin/$BASE_REF"

      # Pull requests from forks run with a read-only token, so the comment is only attempted for
      # branches of this repository; for a fork the figure stays in the job log.
      - name: Comment new-code coverage on the pull request
        # Not tied to the success of the steps before it: a branch that breaches the coverage
        # bound fails the measuring step, and that is exactly the branch whose figure and list of
        # uncovered lines belong on the pull request. A cancelled run is left alone.
        if: |
          !cancelled() && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          summary=build/reports/new-code-coverage/summary.md
          # A build that broke before the measurement ran leaves no summary behind. The step that
          # broke is already red and carries the reason; failing here as well would bury it.
          if [ ! -f "$summary" ]; then
            echo "No coverage summary was produced; nothing to comment."
            exit 0
          fi
          # The marker identifies this workflow's own comment, so every run edits that one
          # instead of appending another to the conversation. The author is part of the test:
          # anyone may leave a comment carrying the marker, and this job holds the permission to
          # edit comments, so matching on the marker alone would let it overwrite someone else's.
          marker='<!-- new-code-coverage -->'
          body="$marker"$'\n'"$(cat "$summary")"
          # --paginate --slurp yields one array per page, which add joins back into one list.
          existing=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate --slurp |
            jq -r --arg marker "$marker" '(add // [])
              | map(select(.user.login == "github-actions[bot]" and (.body | startswith($marker))))
              | first | .id // empty')
          if [ -n "$existing" ]; then
            jq -n --arg body "$body" '{body: $body}' |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" --input -
          else
            jq -n --arg body "$body" '{body: $body}' |
              gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi

      - name: Publish Test Report with Annotations
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
      - name: Upload HTML Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/test/'
      - name: Upload Coverage Reports Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: '**/build/reports/jacoco/test/'
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  # Every platform runs the same scenario and writes a fingerprint of its course, one hash per
  # snapshot; the job after it requires the same fingerprint from all of them. The scenario runs
  # beside the tests rather than after them, so that it adds no time to the build as long as it is
  # shorter than the test job.
  fingerprint:
    name: Platform Fingerprint
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to its end, so that the comparison sees every platform's fingerprint.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Fix Git Path on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          # The test job of the same platform saves the Gradle cache under the same key and needs
          # more of it; a save from this job, which ends first, would leave that part out.
          cache-read-only: true
      # Compiling the test sources builds the resources, the web frontend among them, which npm
      # takes from this cache.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Run the platform comparison scenario
        run: ./gradlew platformFingerprint --no-daemon
      - name: Upload fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.os }}
          path: build/platform-fingerprint/fingerprint.txt

  compare-fingerprints:
    name: Compare Platform Fingerprints
    needs: fingerprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download fingerprints
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
          path: fingerprints
      - name: Compare fingerprints
        run: |
          set -euo pipefail
          # Each fingerprint holds one line per snapshot, its tick and the hash of the simulation's
          # state. Linux is the reference; the first line in which another platform differs names
          # the tick from which on the platforms took different courses.
          reference=fingerprints/fingerprint-ubuntu-latest/fingerprint.txt
          echo "Reference: $(wc -l < "$reference") snapshots from ubuntu-latest"
          status=0
          for file in fingerprints/*/fingerprint.txt; do
            [ "$file" = "$reference" ] && continue
            platform=$(basename "$(dirname "$file")")
            platform=${platform#fingerprint-}
            if cmp -s "$reference" "$file"; then
              echo "$platform: identical"
            else
              status=1
              line=$(cmp "$reference" "$file" 2>&1 | sed -n 's/.* line \([0-9]*\).*/\1/p' || true)
              echo "::error::$platform differs from ubuntu-latest from line ${line:-?} on"
              echo "  ubuntu-latest: $(sed -n "${line:-1}p" "$reference")"
              echo "  $platform: $(sed -n "${line:-1}p" "$file")"
              echo "  snapshots: ubuntu-latest $(wc -l < "$reference"), $platform $(wc -l < "$file")"
            fi
          done
          exit $status

  # Builds the platform distributions a run publishes or tests. It starts with the tests, not
  # after them, so that packaging, start tests and the image add no time to a pull request as
  # long as they are shorter than the tests and the reviews. The archives carry the tag the plan
  # names, and the jobs after this one read the tag and whether the run publishes from here.
  package:
    name: Package
    needs: [plan, draft]
    # The check of the draft is skipped where the run builds no release, and a job whose need was
    # skipped is skipped itself unless its condition asks about the state of the run
    if: |
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.package == 'true' &&
      (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
      publish: ${{ needs.plan.outputs.publish }}
      release: ${{ needs.plan.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 and Gradle Cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # npm keeps the packages of the web frontend in the project's .gradle/npm-cache, which the
      # Gradle cache above does not cover. Keyed on the lock file, npm ci downloads them again only
      # when the lock file changes.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the platform distributions
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: ./gradlew platformDistributions --no-daemon "-PRELEASE_TAG=$RELEASE_TAG"

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evochora-distributions
          path: |
            build/distributions/*.tar.gz
            build/distributions/*.zip
          if-no-files-found: error

  # Starts each distribution on its platform the way a user does: see tools/ci/start_test.py. The
  # older Java the guard must refuse is installed beside it: the oldest Java the guard is built
  # to run on, from Zulu, which publishes it for every platform here. setup-java points JAVA_HOME
  # at it as well, which the start script must not follow while the archive brings its own runtime.
  start-test:
    name: Start Test (${{ matrix.platform }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to its end, so that a failure on one platform does not hide whether the
      # others start.
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: macos-aarch64, os: macos-latest }
          - { platform: linux-x64, os: ubuntu-latest }
          # GitHub offers its Linux ARM runner under a versioned label only
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      # The JDK a user builds a plugin with; the start test builds its plugin with it against the
      # archive's jars
      - name: Set up the JDK the start test builds its plugin with
        id: jdk
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up the older Java the guard must refuse
        id: old-java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Start the distribution
        shell: bash
        env:
          OLD_JAVA: ${{ steps.old-java.outputs.path }}
          JDK: ${{ steps.jdk.outputs.path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python=python3; command -v python3 > /dev/null || python=python
          # An archive built without a tag has nothing between the project and the platform
          "$python" -I tools/ci/start_test.py distributions/evochora-*"$PLATFORM".* --old-java "$OLD_JAVA" --jdk "$JDK"

  # Builds the node image for both architectures from the Linux distributions the start tests run,
  # and starts the amd64 image once. It runs alongside the tests. On a run that publishes it pushes
  # the image by its digest alone, without a tag, and hands the digest on: docker-push tags exactly
  # that image once every check has passed, so that what is published is what was built and
  # started here. A pull request pushes nothing.
  docker:
    name: Docker Image
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.both.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 image to start it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: distributions
          file: ./infrastructure/docker/evochora-node/Dockerfile
          build-contexts: entrypoint=infrastructure/docker/evochora-node
          build-args: EVOCHORA_VERSION=${{ needs.package.outputs.tag }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.tag }}
          load: true
          tags: evochora-start-test
          # Read only: an export replaces the whole cache entry, and one of amd64 alone would leave
          # the build for both architectures below without arm64's layers. That build writes it.
          cache-from: type=gha

      - name: Start the image
        run: docker run --rm evochora-start-test bin/evochora --help

      - name: Log in to GitHub Container Registry
        if: needs.package.outputs.publish == 'true' || needs.package.outputs.release == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build for both architectures; its amd64 half is the image started above, taken
      # from the builder's cache. On a run that publishes the nightly or prepares a release it is
      # pushed by its digest alone, under no name: the tag is set later on exactly that digest.
      - name: Build the image for both architectures
        id: both
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: distributions
          file: ./infrastructure/docker/evochora-node/Dockerfile
          build-contexts: entrypoint=infrastructure/docker/evochora-node
          build-args: EVOCHORA_VERSION=${{ needs.package.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.tag }}
          outputs: ${{ (needs.package.outputs.publish == 'true' || needs.package.outputs.release == 'true') && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the image the docker job built, started and pushed by its digest as the nightly, once
  # every check has passed. It builds nothing: the tag is set on exactly that digest. The image
  # of a release gets its tag when the release is published.
  docker-push:
    name: Push Docker Image
    needs: [test, fingerprint, compare-fingerprints, package, start-test, docker]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' && needs.fingerprint.result == 'success' &&
      needs.compare-fingerprints.result == 'success' &&
      needs.package.result == 'success' && needs.start-test.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.package.outputs.publish == 'true'
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image the docker job built
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  # Publishes the distributions as the nightly, once everything before it has passed, the push
  # of the image included, so that the nightly never names an image that is missing or old. The
  # nightly is deleted and created anew, never changed in place: GitHub shows a release under the
  # date it was first published, and a nightly that kept its release would show the date of the
  # first one for ever. It carries the text of .github/release-notes-nightly.md with the commit
  # it was built from.
  publish:
    name: Publish Nightly
    needs: [test, fingerprint, compare-fingerprints, package, start-test, docker, docker-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' && needs.fingerprint.result == 'success' &&
      needs.compare-fingerprints.result == 'success' &&
      needs.package.result == 'success' && needs.start-test.result == 'success' &&
      needs.docker.result == 'success' && needs.docker-push.result == 'success' &&
      needs.package.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      - name: Write the text of the nightly for the commit this run built
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          BUILD_DATE=$(date -u -d "@$NOW" +%Y-%m-%d)
          BUILD_TIME=$(date -u -d "@$NOW" +%H:%M)
          sed -e "s|@DATE@|$BUILD_DATE|g" -e "s|@TIME@|$BUILD_TIME|g" -e "s|@COMMIT@|${SHA:0:8}|g" \
            -e "s|@COMMIT_URL@|$COMMIT_URL|g" .github/release-notes-nightly.md > release-notes-nightly.md
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      # Deleting the release takes its tag with it, and creating it sets the tag on the commit
      # this run built. GitHub can keep a release that is created right after the deletion of one
      # of the same tag as a draft, which nobody sees: the pause avoids that, and the last line
      # fails the run where it has happened all the same.
      - name: Delete the nightly and create it anew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view nightly --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release delete nightly --repo "$REPOSITORY" --cleanup-tag --yes
            sleep 15
          fi
          gh release create nightly --repo "$REPOSITORY" --target "$SHA" --prerelease \
            --title "Nightly build $BUILD_DATE (${SHA:0:8})" --notes-file release-notes-nightly.md \
            distributions/*.tar.gz distributions/*.zip
          test "$(gh release view nightly --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = "false"

  # Finishes the draft of a release once everything before it has passed: the distributions the
  # start tests ran are attached, the draft is aimed at the commit this run built, and the text
  # of .github/release-notes-release.md is written below the maintainer's. Nothing is public
  # after this job. The draft, with its distributions, is there for the maintainer to try before
  # approving the publication.
  prepare-release:
    name: Prepare Release
    needs: [test, fingerprint, compare-fingerprints, package, start-test, docker]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' && needs.fingerprint.result == 'success' &&
      needs.compare-fingerprints.result == 'success' &&
      needs.package.result == 'success' && needs.start-test.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.package.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      # The maintainer's text ends where the line of the workflow begins; what an earlier run
      # wrote below it is replaced. A line of the template that names something this release
      # does not have, a DOI or an earlier release to compare with, is left out.
      - name: Write the text of the workflow below the maintainer's
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.tag }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          DOI: ''
        run: |
          set -euo pipefail
          gh release view "$VERSION" --repo "$REPOSITORY" --json body --jq .body |
            sed '/^<!-- What follows is written by the release workflow/,$d' > release-notes.md
          previous=$(gh release list --repo "$REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          {
            echo
            sed -e "$([ -n "$DOI" ] || echo '/@DOI@/d')" -e "$([ -n "$previous" ] || echo '/@PREVIOUS@/d')" \
              -e "s|@TAG@|$VERSION|g" -e "s|@DOI@|$DOI|g" -e "s|@COMMIT@|${SHA:0:8}|g" \
              -e "s|@COMMIT_URL@|$SERVER_URL/$REPOSITORY/commit/$SHA|g" -e "s|@PREVIOUS@|$previous|g" \
              -e "s|@COMPARE_URL@|$SERVER_URL/$REPOSITORY/compare/$previous...$VERSION|g" \
              .github/release-notes-release.md
          } >> release-notes.md
          cat -s release-notes.md > release-notes-final.md

      - name: Attach the distributions and aim the draft at the commit this run built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A draft an earlier run prepared may hold files this run did not build
          gh release view "$VERSION" --repo "$REPOSITORY" --json assets --jq '.assets[].name' |
            while read -r asset; do
              gh release delete-asset "$VERSION" "$asset" --repo "$REPOSITORY" --yes
            done
          gh release upload "$VERSION" --repo "$REPOSITORY" distributions/*.tar.gz distributions/*.zip
          # A version with a suffix, v1.0.0-rc.1, is a pre-release, as SemVer has it
          prerelease=false; if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$VERSION" --repo "$REPOSITORY" --target "$SHA" \
            --prerelease="$prerelease" --notes-file release-notes-final.md
          echo "The draft of $VERSION is ready. Try its distributions, then approve the job that publishes it." >> "$GITHUB_STEP_SUMMARY"

  # Publishes what the run prepared, after the maintainer has approved: the environment
  # "release" holds this job until then. The image gets its tag first and the draft is published
  # last, so that the release never names an image that is missing. GitHub creates the tag of
  # the release at that moment, on the commit the draft is aimed at, and opens the discussion
  # that announces it. A release is published from main alone: a run on another branch prepares
  # a draft and ends there.
  publish-release:
    name: Publish Release
    needs: [package, docker, prepare-release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      discussions: write
    steps:
      # GitHub creates an environment that a workflow names and the repository lacks, without
      # any protection, and this job would then publish without having been approved
      - name: Refuse to publish where the environment requires no approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$REPOSITORY/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::The environment release requires no approval. Set its required reviewers" \
                 "in the settings of the repository before a release is published."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image the docker job built
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$REPOSITORY" --draft=false --discussion-category "Announcements"
          test "$(gh release view "$VERSION" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = "false"
