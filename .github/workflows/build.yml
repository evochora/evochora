# Actions are pinned to a commit, with the release tag beside it. A tag such as @v4 is a moving
# pointer: whoever owns the action can aim it at different code, and the next run would fetch that.
# A commit cannot move. Updating one means resolving the new tag to its commit and replacing both.

name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  release:
    # Trigger when a draft release is published via GitHub UI
    # This creates a tag, but doesn't fire 'push' event
    types: [ published ]

jobs:
  notebooks:
    name: Verify Notebooks
    runs-on: ubuntu-latest
    # Notebooks are committed without outputs, enforced by a git clean filter that each clone
    # has to register once. Git silently ignores an unregistered filter, so this job is what
    # actually keeps generated data out of the repository.
    if: github.event_name != 'release'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify notebooks contain no execution state
        run: python3 tools/nbstrip.py --check notebooks

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    # Skip redundant test run for release events - the tag was already tested on main
    if: github.event_name != 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Fix Git Path on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # PMD keys its incremental cache on file content, ruleset and classpath, so a cache from an
      # earlier commit is valid for every unchanged file. Without it every run analyses the whole
      # tree, and the test sources alone take PMD longer than compiling the project.
      - name: Restore PMD incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tmp/pmd*/incremental.cache
          key: pmd-${{ runner.os }}-${{ github.sha }}
          restore-keys: pmd-${{ runner.os }}-
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Build and run tests with Gradle
        run: ./gradlew build --info --stacktrace
      - name: Publish Test Report with Annotations
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: '**/build/test-results/test/**/*.xml'
      - name: Upload HTML Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/test/'
      - name: Upload Coverage Reports Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: '**/build/reports/jacoco/test/'
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  release:
    name: Build, Package & Release
    needs: test
    runs-on: ubuntu-latest
    # Run on: push to main, push of v* tag, OR release published (with v* tag)
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
      )
    permissions:
      contents: write
      packages: write
    steps:
      - name: Determine version tag
        id: version
        env:
          # Read from the environment rather than written into the script: a release tag is
          # chosen by whoever publishes the release, and git allows characters in a tag name
          # that a shell reads as syntax.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            # Release event: tag comes from the release object
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: extract tag name from ref
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            # Main branch push: use 'latest'
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For release events, checkout the tag explicitly.
          # For push/workflow_dispatch, use the triggering commit (github.sha).
          ref: ${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.tag || github.sha }}

      - name: Set up JDK 21 and Gradle Cache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Distribution Archives with Gradle
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./gradlew distZip distTar --no-daemon "-PRELEASE_TAG=$RELEASE_TAG"

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evochora-distribution
          path: build/distributions/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./infrastructure/docker/evochora-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          build-args: |
            RELEASE_TAG=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 'latest' is a pre-release, versioned tags are full releases
          prerelease: ${{ steps.version.outputs.tag == 'latest' }}
          files: |
            build/distributions/*.zip
            build/distributions/*.tar.gz
