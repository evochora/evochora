# Actions are pinned to a commit, with the release tag beside it. A tag such as @v4 is a moving
# pointer: whoever owns the action can aim it at different code, and the next run would fetch that.
# A commit cannot move. Updating one means resolving the new tag to its commit and replacing both.

name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  release:
    # Trigger when a draft release is published via GitHub UI
    # This creates a tag, but doesn't fire 'push' event
    types: [ published ]

# Each pull request has one group, and so has every other ref: main, and each tag on its own. A
# newer run cancels the older run of its group, so only the newest state of a pull request is
# checked and only the newest state of main is published. A run of main cancelled while it
# publishes can leave the pre-release latest half updated until the next run of main that passes;
# latest is a development build, and that run writes all of it anew. Runs of different tags never
# meet in a group, so a release with a version number is only cancelled by a newer run of its own
# tag, which publishes the same release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Verify Notebooks
    runs-on: ubuntu-latest
    # Notebooks are committed without outputs, enforced by a git clean filter that each clone
    # has to register once. Git silently ignores an unregistered filter, so this job is what
    # actually keeps generated data out of the repository.
    if: github.event_name != 'release'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify notebooks contain no execution state
        run: python3 tools/nbstrip.py --check notebooks

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    # Runs for a published release as well: the release is built anew from its tag, so its tests
    # run on that tag rather than relying on an earlier run that nothing ties to it
    strategy:
      # Every leg runs to its end, so that a failure on one platform does not hide whether the
      # others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      checks: write
      # Writing the new-code coverage comment on a pull request.
      pull-requests: write
    steps:
      - name: Fix Git Path on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The new-code coverage step needs the merge base, which a shallow clone does not
          # contain. The full history costs bandwidth, so only the run that computes it takes it.
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      # npm keeps the packages of the web frontend in the project's .gradle/npm-cache, which the
      # Gradle cache above does not cover. Keyed on the lock file, npm ci downloads them again only
      # when the lock file changes.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # PMD keys its incremental cache on file content, ruleset and classpath, so a cache from an
      # earlier commit is valid for every unchanged file. Without it every run analyses the whole
      # tree, and the test sources alone take PMD longer than compiling the project.
      - name: Restore PMD incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tmp/pmd*/incremental.cache
          key: pmd-${{ runner.os }}-${{ github.sha }}
          restore-keys: pmd-${{ runner.os }}-
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      # check, not build: the archives that assemble would add are built and started by the
      # package and start-test jobs
      - name: Build and run tests with Gradle
        run: ./gradlew check --info --stacktrace
      # Coverage of the lines this branch changes, as a counterpart to the project-wide gate the
      # build applies. It reads the JaCoCo report the previous step produced and therefore has to
      # follow it. One pull request gets one comment, so only the Linux leg of the matrix runs it.
      - name: Measure new-code coverage
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./gradlew newCodeCoverage "-PnewCodeCoverage.baseRef=origin/$BASE_REF"

      # Pull requests from forks run with a read-only token, so the comment is only attempted for
      # branches of this repository; for a fork the figure stays in the job log.
      - name: Comment new-code coverage on the pull request
        # Not tied to the success of the steps before it: a branch that breaches the coverage
        # bound fails the measuring step, and that is exactly the branch whose figure and list of
        # uncovered lines belong on the pull request. A cancelled run is left alone.
        if: |
          !cancelled() && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          summary=build/reports/new-code-coverage/summary.md
          # A build that broke before the measurement ran leaves no summary behind. The step that
          # broke is already red and carries the reason; failing here as well would bury it.
          if [ ! -f "$summary" ]; then
            echo "No coverage summary was produced; nothing to comment."
            exit 0
          fi
          # The marker identifies this workflow's own comment, so every run edits that one
          # instead of appending another to the conversation. The author is part of the test:
          # anyone may leave a comment carrying the marker, and this job holds the permission to
          # edit comments, so matching on the marker alone would let it overwrite someone else's.
          marker='<!-- new-code-coverage -->'
          body="$marker"$'\n'"$(cat "$summary")"
          # --paginate --slurp yields one array per page, which add joins back into one list.
          existing=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate --slurp |
            jq -r --arg marker "$marker" '(add // [])
              | map(select(.user.login == "github-actions[bot]" and (.body | startswith($marker))))
              | first | .id // empty')
          if [ -n "$existing" ]; then
            jq -n --arg body "$body" '{body: $body}' |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" --input -
          else
            jq -n --arg body "$body" '{body: $body}' |
              gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi

      - name: Publish Test Report with Annotations
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
      - name: Upload HTML Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/test/'
      - name: Upload Coverage Reports Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: '**/build/reports/jacoco/test/'
      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  # Every platform runs the same scenario and writes a fingerprint of its course, one hash per
  # snapshot; the job after it requires the same fingerprint from all of them. The scenario runs
  # beside the tests rather than after them, so that it adds no time to the build as long as it is
  # shorter than the test job.
  fingerprint:
    name: Platform Fingerprint
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to its end, so that the comparison sees every platform's fingerprint.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Fix Git Path on Windows
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          # The test job of the same platform saves the Gradle cache under the same key and needs
          # more of it; a save from this job, which ends first, would leave that part out.
          cache-read-only: true
      # Compiling the test sources builds the resources, the web frontend among them, which npm
      # takes from this cache.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Run the platform comparison scenario
        run: ./gradlew platformFingerprint --no-daemon
      - name: Upload fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.os }}
          path: build/platform-fingerprint/fingerprint.txt

  compare-fingerprints:
    name: Compare Platform Fingerprints
    needs: fingerprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download fingerprints
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
          path: fingerprints
      - name: Compare fingerprints
        run: |
          set -euo pipefail
          # Each fingerprint holds one line per snapshot, its tick and the hash of the simulation's
          # state. Linux is the reference; the first line in which another platform differs names
          # the tick from which on the platforms took different courses.
          reference=fingerprints/fingerprint-ubuntu-latest/fingerprint.txt
          echo "Reference: $(wc -l < "$reference") snapshots from ubuntu-latest"
          status=0
          for file in fingerprints/*/fingerprint.txt; do
            [ "$file" = "$reference" ] && continue
            platform=$(basename "$(dirname "$file")")
            platform=${platform#fingerprint-}
            if cmp -s "$reference" "$file"; then
              echo "$platform: identical"
            else
              status=1
              line=$(cmp "$reference" "$file" 2>&1 | sed -n 's/.* line \([0-9]*\).*/\1/p' || true)
              echo "::error::$platform differs from ubuntu-latest from line ${line:-?} on"
              echo "  ubuntu-latest: $(sed -n "${line:-1}p" "$reference")"
              echo "  $platform: $(sed -n "${line:-1}p" "$file")"
              echo "  snapshots: ubuntu-latest $(wc -l < "$reference"), $platform $(wc -l < "$file")"
            fi
          done
          exit $status

  # Builds the platform distributions every event publishes or tests. It starts with the tests,
  # not after them, so that packaging, start tests and the image add no time to a pull request as
  # long as they are shorter than the tests and the reviews. The version comes from the release tag
  # for a release and is "latest" for anything else. Whether the run publishes is decided here as
  # well, once for every job that publishes: a push to main, a v* tag, or a published release with
  # a v* tag.
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Determine version tag
        id: version
        env:
          # Read from the environment rather than written into the script: a release tag is
          # chosen by whoever publishes the release, and git allows characters in a tag name
          # that a shell reads as syntax.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            # Release event: tag comes from the release object
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            if [[ "$RELEASE_TAG" == v* ]]; then publish=true; else publish=false; fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: extract tag name from ref
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            publish=true
          else
            # Main branch push, pull request or manual run: use 'latest'
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              publish=true
            else
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For release events, checkout the tag explicitly.
          # For everything else, use the triggering commit (github.sha).
          ref: ${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.tag || github.sha }}

      - name: Set up JDK 25 and Gradle Cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # npm keeps the packages of the web frontend in the project's .gradle/npm-cache, which the
      # Gradle cache above does not cover. Keyed on the lock file, npm ci downloads them again only
      # when the lock file changes.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the platform distributions
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./gradlew platformDistributions --no-daemon "-PRELEASE_TAG=$RELEASE_TAG"

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evochora-distributions
          path: |
            build/distributions/*.tar.gz
            build/distributions/*.zip
          if-no-files-found: error

  # Starts each distribution on its platform the way a user does: see tools/ci/start_test.py. The
  # older Java the guard must refuse is installed beside it: the oldest Java the guard is built
  # to run on, from Zulu, which publishes it for every platform here. setup-java points JAVA_HOME
  # at it as well, which the start script must not follow while the archive brings its own runtime.
  start-test:
    name: Start Test (${{ matrix.platform }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to its end, so that a failure on one platform does not hide whether the
      # others start.
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: macos-aarch64, os: macos-latest }
          - { platform: linux-x64, os: ubuntu-latest }
          # GitHub offers its Linux ARM runner under a versioned label only
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.is_release == 'true' && needs.package.outputs.tag || github.sha }}
          sparse-checkout: tools/ci

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      # The JDK a user builds a plugin with; the start test builds its plugin with it against the
      # archive's jars
      - name: Set up the JDK the start test builds its plugin with
        id: jdk
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up the older Java the guard must refuse
        id: old-java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Start the distribution
        shell: bash
        env:
          OLD_JAVA: ${{ steps.old-java.outputs.path }}
          JDK: ${{ steps.jdk.outputs.path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python=python3; command -v python3 > /dev/null || python=python
          "$python" -I tools/ci/start_test.py distributions/evochora-*-"$PLATFORM".* --old-java "$OLD_JAVA" --jdk "$JDK"

  # Builds the node image for both architectures from the Linux distributions the start tests run,
  # and starts the amd64 image once. It runs alongside the tests. On a run that publishes it pushes
  # the image by its digest alone, without a tag, and hands the digest on: docker-push tags exactly
  # that image once every check has passed, so that what is published is what was built and
  # started here. A pull request pushes nothing.
  docker:
    name: Docker Image
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.both.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.is_release == 'true' && needs.package.outputs.tag || github.sha }}

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 image to start it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: distributions
          file: ./infrastructure/docker/evochora-node/Dockerfile
          build-contexts: entrypoint=infrastructure/docker/evochora-node
          build-args: EVOCHORA_VERSION=${{ needs.package.outputs.tag }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.tag }}
          load: true
          tags: evochora-start-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image
        run: docker run --rm evochora-start-test bin/evochora --help

      - name: Log in to GitHub Container Registry
        if: needs.package.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build for both architectures; its amd64 half is the image started above, taken
      # from the builder's cache. On a run that publishes it is pushed by its digest alone.
      - name: Build the image for both architectures
        id: both
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: distributions
          file: ./infrastructure/docker/evochora-node/Dockerfile
          build-contexts: entrypoint=infrastructure/docker/evochora-node
          build-args: EVOCHORA_VERSION=${{ needs.package.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.tag }}
          outputs: ${{ needs.package.outputs.publish == 'true' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the image the docker job built, started and pushed by its digest, once every check has
  # passed, on a run that publishes. It builds nothing: the tag is set on exactly that digest.
  docker-push:
    name: Push Docker Image
    needs: [test, fingerprint, compare-fingerprints, package, start-test, docker]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' && needs.fingerprint.result == 'success' &&
      needs.compare-fingerprints.result == 'success' &&
      needs.package.result == 'success' && needs.start-test.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.package.outputs.publish == 'true'
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image the docker job built
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  # Publishes the distributions as the release of their tag, or as the pre-release "latest" for the
  # current state of main, once everything before it has passed, the push of the image included, so
  # that a release never names an image that is missing or old. The pre-release carries the text
  # of .github/release-notes-latest.md with the commit it was built from; a release with a version
  # number keeps the text it was published with, and one whose version has a suffix is a
  # pre-release.
  publish:
    name: Publish Release
    needs: [test, fingerprint, compare-fingerprints, package, start-test, docker, docker-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' && needs.fingerprint.result == 'success' &&
      needs.compare-fingerprints.result == 'success' &&
      needs.package.result == 'success' && needs.start-test.result == 'success' &&
      needs.docker.result == 'success' && needs.docker-push.result == 'success' &&
      needs.package.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.is_release == 'true' && needs.package.outputs.tag || github.sha }}
          sparse-checkout: .github

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evochora-distributions
          path: distributions

      # A tag stays on the commit it was first set to: latest is moved to the commit this run
      # built, so that the release names what it carries. A first run creates it.
      - name: Point the tag latest at the commit this run built
        if: needs.package.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/latest" --silent; then
            gh api -X PATCH "repos/$REPOSITORY/git/refs/tags/latest" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$SHA" --silent
          fi

      - name: Write the text of latest for the commit this run built
        if: needs.package.outputs.tag == 'latest'
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sed -e "s|@COMMIT@|${SHA:0:8}|g" -e "s|@COMMIT_URL@|$COMMIT_URL|g" \
            .github/release-notes-latest.md > release-notes-latest.md

      - name: Update the pre-release latest
        if: needs.package.outputs.tag == 'latest'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          prerelease: true
          body_path: release-notes-latest.md
          files: |
            distributions/*.tar.gz
            distributions/*.zip

      # The action replaces files of the same name and adds new ones but removes none, so a file
      # the current state no longer has, such as an archive renamed or a platform dropped, would
      # stay at latest without ever being updated again. Removed after the upload, which leaves
      # latest existing in any case. A release with a version number is created once and keeps
      # its files.
      - name: Remove the files of latest that this run did not upload
        if: needs.package.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view latest --repo "$REPOSITORY" --json assets --jq '.assets[].name' |
            while read -r asset; do
              if [ ! -f "distributions/$asset" ]; then
                echo "Removing $asset"
                gh release delete-asset latest "$asset" --repo "$REPOSITORY" --yes
              fi
            done

      - name: Create or update the release
        if: needs.package.outputs.tag != 'latest'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          # A version with a suffix, v1.3.0-dev.1 or v1.3.0-rc.1, is a pre-release, as SemVer has it
          prerelease: ${{ contains(needs.package.outputs.tag, '-') }}
          files: |
            distributions/*.tar.gz
            distributions/*.zip
