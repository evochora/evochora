# Actions are pinned to a commit, with the release tag beside it, for the reason given in
# build.yml: a version tag is a pointer its owner can move, a commit is not.

name: Manual Deploy to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The image tag to deploy (e.g., "nightly" or "v1.0.1")'
        required: true
        type: string
        default: 'nightly'

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    # Checkout reads a public repository and the rest happens over ssh, so the token needs
    # nothing beyond reading the contents it checks out.
    permissions:
      contents: read

    steps:
      # Which commit the image was built from is recorded in the image itself: the build
      # workflow writes org.opencontainers.image.revision into its labels. Reading it here
      # means the configuration deployed alongside an image always comes from the same
      # commit as the image, whatever branch this workflow was started from. Without it,
      # deploying an older image from main would pair old code with today's configuration.
      #
      # The labels live apart from the layers, so this reads a few kilobytes, not the image.
      - name: Resolve the commit the image was built from
        id: image
        env:
          # Read from the environment, not written into the script text: a value interpolated
          # there becomes part of the command rather than an argument to it.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A tag or a digest, nothing else. The value reaches a shell on the production server
          # further down, so what it may contain is stated here rather than assumed.
          if ! printf '%s' "$INPUT_TAG" | grep -qE '^([A-Za-z0-9][A-Za-z0-9._-]*|@sha256:[a-f0-9]{64})$'; then
            echo "::error::Not a usable image reference: '$INPUT_TAG'. Expected a tag made of"\
                 "letters, digits, dot, underscore and hyphen, or @sha256: followed by 64 hex digits."
            exit 1
          fi
          REF="ghcr.io/${REPOSITORY}:${INPUT_TAG}"
          if [ "${INPUT_TAG#@}" != "$INPUT_TAG" ]; then REF="ghcr.io/${REPOSITORY}${INPUT_TAG}"; fi
          echo "Inspecting $REF"
          # A multi-architecture image carries one label set per architecture. They should all
          # name the same commit; if they ever disagree, there is no single configuration that
          # belongs to this image, and guessing would be worse than stopping.
          REVISIONS=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' \
            | jq -r '.. | objects | ."org.opencontainers.image.revision"? // empty' \
            | sort -u)
          COUNT=$(printf '%s\n' "$REVISIONS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Cannot tell which commit $REF was built from: found $COUNT distinct" \
                 "revision labels [$REVISIONS]. Expected exactly one. Deploy aborted."
            exit 1
          fi
          REVISION="$REVISIONS"
          echo "Image was built from commit $REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Checkout that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.image.outputs.revision }}

      - name: Install SSH key and add known_hosts
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The action will automatically run ssh-keyscan for this host
          known_hosts: ${{ secrets.SSH_HOST }}

      # A run of the demo is recorded by a container started by hand, which has the database
      # open; the node this deploy starts would want it too. Such a container is one compose
      # started with `run`, which is what the label says. Checked before anything is copied, so
      # that a refused deploy leaves the server as it was.
      - name: Refuse while a run is being recorded
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          RECORDING=$(ssh -o StrictHostKeyChecking=no "$SSH_TARGET" \
            'docker ps --filter label=com.docker.compose.oneoff=True --format "{{.Names}}"')
          if [ -n "$RECORDING" ]; then
            echo "::error::A container started by hand is running on the server ($RECORDING)." \
                 "It records a run; stop it before deploying."
            exit 1
          fi

      # Copied from the commit checked out above, so they match the image being deployed.
      #
      # None of them starts a simulation: docker-compose.yml runs the node with `node show`,
      # which only reads the recorded runs, and the configurations of the demo's runs take
      # effect only when a run is recorded with them by hand.
      - name: Copy configuration to server
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          # The main configuration files, the Caddyfile among them.
          scp -o StrictHostKeyChecking=no infrastructure/demo/docker-compose.yml "$SSH_TARGET:~/app/docker-compose.yml"
          scp -o StrictHostKeyChecking=no infrastructure/demo/Caddyfile "$SSH_TARGET:~/app/Caddyfile"
          ssh -o StrictHostKeyChecking=no "$SSH_TARGET" "mkdir -p ~/app/config"
          scp -o StrictHostKeyChecking=no config/evochora.conf "$SSH_TARGET:~/app/config/evochora.conf"
          # The configurations the demo's runs are recorded with, beside the one they include.
          scp -o StrictHostKeyChecking=no infrastructure/demo/config/replication.conf infrastructure/demo/config/population.conf "$SSH_TARGET:~/app/config/"

      # The homepage is no part of the image and always comes from main, whatever image is deployed:
      # an image built before a correction of the homepage must not bring the old homepage back.
      # The files are copied into the directory Caddy has mounted, so they are served at once.
      - name: Checkout the homepage from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: homepage
          sparse-checkout: infrastructure/demo/site

      - name: Copy the homepage to server
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_TARGET" "mkdir -p ~/app/site"
          scp -o StrictHostKeyChecking=no -r homepage/infrastructure/demo/site/. "$SSH_TARGET:~/app/site/"

      # The .env is written here and copied over, and the commands sent to the server contain no
      # interpolated value at all. Anything written into that command text would be executed by a
      # shell on the production machine, not read by it as data.
      - name: Create .env file and Deploy with Docker Compose
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          {
            printf 'DOMAIN_NAME=%s\n' "$DOMAIN_NAME"
            printf 'IMAGE_TAG=%s\n' "$INPUT_TAG"
            printf 'JAVA_MAX_MEM=16g\n'
          } > deploy.env
          scp -o StrictHostKeyChecking=no deploy.env "$SSH_TARGET:~/app/.env.incoming"

          ssh "$SSH_TARGET" << 'EOF'
            set -e # Exit immediately if a command exits with a non-zero status.
            cd ~/app

            mv .env.incoming .env

            # Pull the new image version from the registry
            docker compose pull

            # Create both containers anew, whether or not compose sees a change: the Caddyfile
            # and the configuration are files handed into the containers, and a container that
            # keeps running keeps the content it started with. The data and Caddy's certificates
            # lie outside the containers and stay.
            docker compose up -d --force-recreate

            # The image this deploy replaced is left without a tag; remove such images, so that
            # they do not fill the disk deploy by deploy.
            docker image prune -f
          EOF

      # The containers being started says little: a node that cannot read its configuration
      # ends again at once. The deploy has passed when the homepage, which Caddy delivers, and
      # the list of the runs, which the node answers, are both there.
      - name: Wait until the demo answers
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euo pipefail
          for path in / /analyzer/api/runs; do
            status=none
            for attempt in $(seq 1 36); do
              status=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://$DOMAIN_NAME$path" || true)
              if [ "$status" = "200" ]; then break; fi
              sleep 5
            done
            if [ "$status" != "200" ]; then
              echo "::error::The demo does not answer at $path: status $status after three minutes."
              exit 1
            fi
            echo "$path answers with 200"
          done
