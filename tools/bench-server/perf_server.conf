# Real-run comparison configuration: the simulation engine and a hashing consumer,
# nothing else. Nothing is persisted, chunks flow through an in-memory queue, and the
# engine pauses itself at a fixed tick so every compared variant does identical work.
# Used by run-comparison.sh; see .claude/skills/benchmark/SKILL.md and docs/BENCHMARKING.md.
include file("evochora.conf")

pipeline.dataBaseDir = "/cmp/perf-data"

# Only the engine and the fingerprint consumer start; indexers and persistence stay off.
pipeline.startupSequence = ["tick-hash-consumer", "simulation-engine"]
pipeline.autoStart = true

# Plain in-memory queue instead of the Artemis broker.
pipeline.resources.tick-queue = null
pipeline.resources.tick-queue {
  className = "org.evochora.datapipeline.resources.queues.InMemoryBlockingQueue"
  options { capacity = 10 }
}

pipeline.services.tick-hash-consumer {
  className = "org.evochora.bench.TickHashConsumer"
  resources { input = "queue-in:tick-queue" }
  # Set dumpDir to write every normalized chunk as a file for first-divergence forensics:
  # options { dumpDir = "/cmp/dump" }
  options {}
}

pipeline.services.simulation-engine.options {
  # Wall time is measured from "SimulationEngine started" to "auto-paused at tick".
  # 10 M ticks let the population grow past the parallelism thresholds and deaths accumulate.
  pauseTicks = [10000000]
  resume { enabled = false }
}
