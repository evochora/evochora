# Trace recording: the simulation engine and the trace consumer, nothing else. Every tick is
# sampled, chunks flow through in-memory queues, nothing is persisted; the consumer writes the
# tables described in tools/trace/README.md. Started by run-trace.sh, which appends the run's
# tick count, output directory and any per-task overrides in a generated configuration that
# includes this file.
#
# The include is resolved relative to this file and it is required: a silently skipped include
# would record the defaults of reference.conf instead of the intended world.
include required("../../config/evochora.conf")

# Every tick recorded. With this profile a chunk spans 50 ticks, and the engine does not send a
# partial chunk when it pauses, so run-trace.sh rounds the tick count down to a multiple of 50.
pipeline.tuning = ${profiles.detailed}

# Only the consumer and the engine start; persistence and indexers stay off.
pipeline.startupSequence = ["trace-consumer", "simulation-engine"]
pipeline.autoStart = true

# Only what the recording needs runs. Everything else the defaults would start is taken out
# of the configuration: an entry set to null is not there.

# Node processes: no HTTP server, no H2 console and TCP server, no embedded brokers. The
# pipeline process names the brokers as dependencies it does not use; those go with them.
node.processes.http = null
node.processes.h2-console = null
node.processes.h2-tcp-server = null
node.processes.topic-broker = null
node.processes.queue-broker = null
node.processes.pipeline.require.topicBroker = null
node.processes.pipeline.require.queueBroker = null
node.show-welcome-message = false

# Pipeline resources: nothing that persists, indexes, or talks to a broker.
pipeline.resources.batch-topic = null
pipeline.resources.metadata-topic = null
pipeline.resources.index-database = null
pipeline.resources.tick-storage = null
pipeline.resources.persistence-dlq = null
pipeline.resources.index-idempotency = null
pipeline.resources.indexer-retry = null
pipeline.resources.indexer-dlq = null

# Pipeline services: only the engine and the trace consumer remain. The second indexer
# instances are defined from the first ones; they have to go explicitly, or the definition
# that builds on a service set to null fails to resolve.
pipeline.services.persistence-service-1 = null
pipeline.services.persistence-service-2 = null
pipeline.services.metadata-persistence-service = null
pipeline.services.metadata-indexer = null
pipeline.services.environment-indexer-1 = null
pipeline.services.environment-indexer-2 = null
pipeline.services.organism-indexer-1 = null
pipeline.services.organism-indexer-2 = null
pipeline.services.analytics-indexer-1 = null
pipeline.services.analytics-indexer-2 = null

# The engine binds a storage for resume; resume is off, and the storage is gone.
pipeline.services.simulation-engine.resources.resumeStorage = null

# Plain in-memory queue for the tick chunks; the metadata queue is in-memory by default.
pipeline.resources.tick-queue = null
pipeline.resources.tick-queue {
  className = "org.evochora.datapipeline.resources.queues.InMemoryBlockingQueue"
  options { capacity = 10 }
}

pipeline.services.trace-consumer {
  className = "org.evochora.tools.trace.TraceConsumer"
  resources {
    input = "queue-in:tick-queue"
    metadata = "queue-in:metadata-queue"
  }
  options {
    # outputDir is set by run-trace.sh.
    # Complete set of occupied cells every so many ticks; 1 records it every tick.
    cellSnapshotInterval = 1000
  }
}

pipeline.services.simulation-engine.options {
  # pauseTicks is set by run-trace.sh.
  resume { enabled = false }

  # No world generation, no decay on death, no mutation: a program under the debugger runs in
  # a quiet world. Only the core plugins stay, the label rewriting every newborn gets in a
  # production run; a plugin list written without ${pipeline.core-plugins} drops that too.
  plugins = [] ${pipeline.core-plugins}

  # Per-task overrides go on the run-trace.sh command line as HOCON lines, for example:
  #   'pipeline.services.simulation-engine.options.environment.shape = [256, 160]'
  #   'pipeline.services.simulation-engine.options.seed = 7'
  #   'pipeline.services.simulation-engine.options.organisms = [{ program = "main.evo", initialEnergy = 400000, placement { positions = [16, 16] } }]'
  #   'pipeline.services.simulation-engine.options.runtime.organism.max-energy = 1000000'
  #   'pipeline.services.simulation-engine.options.plugins = [{ className = "org.evochora.runtime.worldgen.DecayOnDeath", options { replacement = "CODE:0" } }] ${pipeline.core-plugins}'
}
